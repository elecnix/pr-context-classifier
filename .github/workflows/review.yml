# Cite reviews each pull request: https://github.com/elecnix/cite
# The action reads the diff from the GitHub API, so the job has no checkout.
name: review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A fork pull request gets a read-only token and no secrets.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: elecnix/cite@eaebbe70378689d61158f43515471544e43c6038  # v0.8.0
        with:
          # A model outage concludes the check as neutral. A finding still fails it.
          tool_failure_blocks: false
          model_id: deepseek/deepseek-v4.1-flash
          model_base_url: https://openrouter.ai/api/v1
          model_api_key: ${{ secrets.MODEL_API_KEY }}
